app = "traintalk"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# TrainTalk uses in-memory rooms — must run as exactly 1 instance.
# Multiple instances would split users across separate room maps.
[deploy]
  strategy = "immediate"

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
